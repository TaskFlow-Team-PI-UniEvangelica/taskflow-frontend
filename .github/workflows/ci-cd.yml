name: CI/CD Frontend

on:
  push:
    branches: [main, master, homol]
  pull_request:
    branches: [main, master, homol]

permissions:
  contents: read

jobs:
  build:
    name: Validação Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.taskflow.party' }}
          VITE_KEYCLOAK_AUTHORITY: ${{ vars.VITE_KEYCLOAK_AUTHORITY || 'https://auth.taskflow.party/realms/taskflow-realm' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'taskflow-frontend' }}
          VITE_REDIRECT_URI: ${{ vars.VITE_REDIRECT_URI || 'https://taskflow.party' }}

  image:
    name: Build & Push Imagem ARM64
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.taskflow.party' }}
            VITE_KEYCLOAK_AUTHORITY=${{ vars.VITE_KEYCLOAK_AUTHORITY || 'https://auth.taskflow.party/realms/taskflow-realm' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'taskflow-frontend' }}
            VITE_REDIRECT_URI=${{ vars.VITE_REDIRECT_URI || 'https://taskflow.party' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/taskflow-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy - bloqueia vulnerabilidades CRITICAL com correção disponível
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskflow-frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'
      - name: Trivy - relatório de vulnerabilidades HIGH (não bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ghcr.io/${{ env.OWNER }}/taskflow-frontend:${{ github.sha }}
          severity: HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'
          output: trivy-high.txt
          skip-setup-trivy: true
      - name: Publica o relatório HIGH no resumo do job
        if: always()
        run: |
          echo "### Trivy (HIGH) - taskflow-frontend" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-high.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "relatório indisponível" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy na Oracle Cloud
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: /srv/taskflow/scripts/deploy.sh frontend ${{ github.sha }}
